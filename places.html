<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Місця — FreeWay</title>
    <meta name="description" content="Перелік громадських місць з оцінкою доступності">
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="images/logo.svg">
</head>
<body>

    <header>
        <a href="index.html" class="logo-link">
            <img src="images/logo.svg" alt="" class="logo" width="50" height="50">
            <h1>FreeWay</h1>
            <p class="tagline">Шлях без бар'єрів!</p>
        </a>

        <nav>
            <ul>
                <li><a href="index.html">Головна</a></li>
                <li><a href="places.html">Місця</a></li>
                <li><a href="add-place.html">Додати місце</a></li>
            </ul>
        </nav>

        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Перемкнути тему">
            <img src="images/icon-moon.png" alt="" class="theme-icon theme-icon--moon" width="20" height="20">
            <img src="images/icon-sun.png" alt="" class="theme-icon theme-icon--sun" width="20" height="20">
        </button>
    </header>

    <main>
        <h2 class="page-title">Місця</h2>
        <p class="page-description">Перелік громадських місць з оцінкою доступності.</p>

        <aside class="sidebar">
            <h2>Фільтри</h2>
            <label for="search-input">Пошук за назвою</label>
            <input type="search" id="search-input" placeholder="Введіть назву..." autocomplete="off">

            <fieldset class="filter-fieldset">
                <legend>Рівень доступності</legend>

                <label class="filter-radio">
                    <input type="radio" name="accessibility-filter" value="all" checked>
                    <span>Усі</span>
                </label>

                <label class="filter-radio">
                    <input type="radio" name="accessibility-filter" value="full">
                    <span>🟢 Повністю доступно</span>
                </label>

                <label class="filter-radio">
                    <input type="radio" name="accessibility-filter" value="partial">
                    <span>🟡 Частково доступно</span>
                </label>

                <label class="filter-radio">
                    <input type="radio" name="accessibility-filter" value="none">
                    <span>🔴 Недоступно</span>
                </label>
            </fieldset>
        </aside>

        <section class="places-list" id="places-list">
            <h2>Усі місця</h2>
        </section>
    </main>

    <footer>
        <p>© 2026 FreeWay.</p>
        <p>Наша мета — зробити міста доступними для всіх</p>
    </footer>
    <script src="script.js" defer></script>

</body>
</html>
